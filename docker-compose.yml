version: "3.9"

services:
  web:
    build: .
    container_name: edupulse_web
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data          # persists SQLite DB
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3